
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.4
    container_name: keycloak
    ports:
      - "9090:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: h2-file
      # kC_HOSTNAME: keycloak
      # KC_HTTP_PORT: 8080
    volumes:
      - keycloak-data:/opt/keycloak/data
    command: ["start-dev", "--db=dev-file"]
    networks:
      - elastic
  event:
    image: event
    container_name: event
    ports:
      - 8080:8080
    environment:
        spring.profiles.active: docker
        DATABASE_URL: ${DATABASE_URL}
        ISSUER_URL: ${ISSUER_URL}
        JWK_URI: ${JWK_URI}
    networks:
      - elastic

volumes:
  keycloak-data:
    driver: local

networks:
  elastic:
    driver: bridge

#Keycloak service =>  docker compose -p restaurant up -d


