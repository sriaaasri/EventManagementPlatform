spring:
  application:
    name: even-management-application
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/event_management}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
    show-sql: true
    generate-ddl: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER_URL:http://localhost:9090/realms/restaurant}
          jwk-set-uri: ${JWK_URI:http://keycloak:8080/realms/restaurant/protocol/openid-connect/certs}
logging:
  level:
    '[com.hanuman.event.controller]': DEBUG
  pattern:
    console: "%d{dd-mm-yy HH:mm:ss} [%-5level] [%thread] %logger{0} : %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 6
management:
  endpoints:
    web:
      exposure:
        include: health
      # base-path: /ep
  info:
    env:
      enabled: true
info:
  name: ${spring.application.name}
        
        
          
