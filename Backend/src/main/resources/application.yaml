spring:
  application:
    name: even-management-application
  datasource:
    url: jdbc:mysql://localhost:3306/event_management
    username: root
    password: Deadman@2001
  jpa:
    show-sql: true
    generate-ddl: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/restaurant
logging:
  level:
    '[com.hanuman.event.controller]': DEBUG
  pattern:
    console: "%d{dd-mm-yy HH:mm:ss} [%-5level] [%thread] %logger{0} : %msg%n"
    # file: "%d{yy-mm-dd HH:mm:ss} %level [${spring.application.name}] [%thread] %logger{36} : %msg%n"
  # file:
  #   path: logPath
  #   name: logName/${spring.application.name}.log 
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 6
management:
  endpoints:
    web:
      exposure:
        include: health
      # base-path: /ep
  info:
    env:
      enabled: true
info:
  name: ${spring.application.name}
        
        
          
